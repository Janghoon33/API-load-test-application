spring:
  application:
    name: loadTestApplication

  datasource:
    url: jdbc:postgresql://localhost:5432/loadtest
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# CORS ?? ??
spring.web.cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  allow-credentials: false

loadtest:
  max-virtual-threads: 50000
  max-platform-threads: 500
  pinning-monitor:
    # 실행 종료 시 JFR 핀닝 이벤트 전달을 확정하기 위해 최대 이만큼 기다린다 (0이면 기다리지 않는다)
    settle-timeout: 2s
  metrics:
    sample-interval: 1s
    peak-sample-interval: 50ms
  http-client:
    connect-timeout: 10s
    request-timeout: 30s

